<div id="inner-box">
    <div class="app" style="height: 480px;">
        <!-- form -->
        <!-- full response -->
        <div id="wrapper">
           <img src="img/logo.svg" width="150" />
            <h4><res>login</res></h4>            
            <br />
        </div>
        <div class="row mw480">

            <!-- authentication form -->
            <form id="form" class="col s12">
                <div class="row">
                    <!-- username field -->
                    <div class="input-field col s12">
                        <!--<i class="mdi-action-account-box prefix"></i>-->
                        <input id="username" name="username" type="text" class="validate" required="" aria-required="true" />
                        <label for="username">USERNAME</label>
                    </div>
                </div>
                <div class="row">
                    <!-- password field -->
                    <div class="input-field col s12">
                        <!--<i class="mdi-action-lock-open prefix"></i>-->
                        <input id="password" name="password" type="password" class="validate" required="" aria-required="true" />
                        <label for="password">PASSWORD</label>
                    </div>
                </div>
                <div class="row">
                    <!-- submit button -->
                    <div class="input-field col s12">                        
                        <button id="login" class="btn-large waves-effect waves-light" type="submit" name="action"><i class="mdi-action-lock left"></i><res>login</res></button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- javascript -->
    <script type="text/javascript">localize('login');</script>
    <script type="text/javascript" src="js/app/page.login.js"></script>
    <!-- end javascript -->
</div>
