<div id="inner-box">
    <!-- fixed header content -->
    <div id="wrapper" class="content-fixed-header pad25">
        <div class="scrolling">
            <br />
            <br />
            <div class="row mw480">
                <!-- form -->
                <form id="form" class="col s12">

                    <div class="row">
                        <div class="input-field col s3">
                            <label for="dhcp" localize>dhcp</label>
                        </div>
                        <div class="input-field col s9">
                            <select id="dhcp" name="dhcp" class="form-select">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s3">
                            <label for="ipaddress" localize>ipaddress</label>
                        </div>
                        <div class="input-field col s9">
                            <input id="ipaddress" type="text" name="ipaddress" maxlength="40" rule-pattern="^\d{0,12}?$" rule-format-message="000000000000" validate />
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="input-field col s3">
                            <label for="netmask" localize>netmask</label>
                        </div>
                        <div class="input-field col s9">
                            <input id="netmask" type="text" name="netmask" maxlength="40" rule-pattern="^\d{0,12}?$" rule-format-message="000000000000" validate />
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s3">
                            <label for="gateway" localize>gateway</label>
                        </div>
                        <div class="input-field col s9">
                            <input id="gateway" type="text" name="gateway" maxlength="40" rule-pattern="^\d{0,12}?$" rule-format-message="000000000000" validate />
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="input-field col s3">
                            <label for="dns1" localize>dns1</label>
                        </div>
                        <div class="input-field col s9">
                            <input id="dns1" type="text" name="dns1" maxlength="40" rule-pattern="^\d{0,12}?$" rule-format-message="000000000000" validate />
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s3">
                            <label for="dns2" localize>dns2</label>
                        </div>
                        <div class="input-field col s9">
                            <input id="dns2" type="text" name="dns2" maxlength="40" rule-pattern="^\d{0,12}?$" rule-format-message="000000000000" validate />
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-field col s12">

                        </div>
                    </div>
                    -->
                    <br>
                    <br>

                    <!-- keyboard lines -->
                    <div class="row">
                        <div id="pulsanti">
                        <table class="btnT">
                            <tr>
                                <td colspan="2"><button id="61" class="btn waves-effect waves-light z-depth-0 savebtn2 orange" type="button" name="action"><span class="center">Save</span></button></td>
                            </tr>   
                            
                        </table>
                        </div>
                    </div>
                </form>
            </div>
            <br />
            <br />
            <h6 id="signal" style="position:fixed; bottom: 10px; right: 10px;"></h6>
        </div>        
    </div>


    <!-- javascript -->
    <script type="text/javascript" src="js/app/page.networksettings.js"></script>
    <!-- end javascript -->
</div>
