server {
    listen 80 default_server; # 'default_server' forza nginx a usare questo blocco
    server_name _;             # Accetta qualsiasi nome host (zrok, localhost, IP)

    root /var/www/html/public;
    index index.php;

    # Importante per i log: così vedrai cosa succede
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass cv-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Aggiungi questo per evitare problemi di timeout con i tunnel
        fastcgi_read_timeout 300;
    }
}
