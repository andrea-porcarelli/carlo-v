[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid

; ── Scheduler Laravel (esegue php artisan schedule:run ogni minuto) ────────────
[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=10

; ── Worker coda 'printers' (2 processi) ───────────────────────────────────────
[program:laravel-worker-printers]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=printers --sleep=3 --tries=3 --timeout=60 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-printers.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=3600

; ── Worker coda 'backups' (1 processo) ────────────────────────────────────────
[program:laravel-worker-backups]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=backups --sleep=10 --tries=1 --timeout=300 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-backups.log
stdout_logfile_maxbytes=10MB
stopwaitsecs=300
